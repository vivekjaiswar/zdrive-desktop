name: build
on:
  push:
  workflow_dispatch:
    inputs:
      beta_suffix:
        description: >-
          Set to build an opt-in beta (e.g. "1" bakes in a "-beta.1"
          version suffix). Leave empty for a normal/stable manual build.
        required: false
        default: ""
env:
  # Bump when a newer WinFsp release is wanted - installer/windows never
  # needs to change, it just takes the filename as a build parameter.
  # WINFSP_SHA256 must be bumped in lockstep (verified below, right after
  # download) - found 2026-10-21 /cso audit: this CI previously bundled
  # WinFsp's MSI (a kernel-driver installer, silently run via `msiexec
  # /quiet` on every Windows install) straight off GitHub with zero
  # integrity check - a compromised upstream WinFsp release would have
  # shipped straight through into every ZDrive installer unnoticed. This
  # hash is WinFsp's own published SHA256 from its release notes
  # (https://github.com/winfsp/winfsp/releases/tag/v2.1, "BUILD HASHES"
  # section) - an independent source, not just "whatever curl happened to
  # fetch" - cross-checked by hand against a separately downloaded copy
  # before pinning.
  WINFSP_VERSION: "2.1.25156"
  WINFSP_SHA256: "073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      # Beta channel (M4-PR-5, OQ16): a workflow_dispatch run with
      # beta_suffix set bakes a "-beta.N" version into the binary via
      # -ldflags -X, not by editing the source file per beta build.
      # ClientVersion is a var specifically to allow this override - see
      # its own comment in backend/zdrive/zdrive.go. Empty LDFLAGS on a
      # normal push is harmless; go build accepts an empty -ldflags value.
      - name: Compute version (beta channel support)
        run: |
          BASE_VERSION=$(sed -n 's/.*ClientVersion = "\(.*\)"/\1/p' backend/zdrive/zdrive.go | head -1)
          VERSION="$BASE_VERSION"
          if [ -n "${{ github.event.inputs.beta_suffix }}" ]; then
            VERSION="${BASE_VERSION}-beta.${{ github.event.inputs.beta_suffix }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LDFLAGS=-X github.com/vivekjaiswar/zdrive-desktop/backend/zdrive.ClientVersion=$VERSION" >> "$GITHUB_ENV"
      - run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags cmount -ldflags "$LDFLAGS" -o dist/zdrive-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/zdrive-linux-amd64 .
      # A single-file Windows installer: bundles WinFsp and silently installs
      # it only if missing, so a user only ever downloads one exe (no
      # separate WinFsp download/install step). See installer/windows for why
      # this is legally free to bundle (this repo's own MIT license).
      - name: Build Windows installer (bundles WinFsp)
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          curl -fsSL -o dist/winfsp.msi \
            "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-${WINFSP_VERSION}.msi"
          echo "${WINFSP_SHA256}  dist/winfsp.msi" | sha256sum -c -
          # NSIS File paths resolve relative to the .nsi script's own
          # directory, not the invocation cwd - pass absolute paths so this
          # works regardless of where makensis is run from. The _NAME
          # defines are separate and deliberate (2026-10-21 fix): the .nsi
          # script's own *runtime* path references ($INSTDIR\...) need just
          # the bare filename, not this absolute CI build path - reusing
          # one define for both was a real bug that silently broke every
          # Windows install (sign-in, and WinFsp's own driver install) -
          # see the .nsi file's own top-of-file comment for the full story.
          makensis \
            -DWINFSP_MSI="$PWD/dist/winfsp.msi" \
            -DWINFSP_MSI_NAME="winfsp.msi" \
            -DZDRIVE_EXE="$PWD/dist/zdrive-windows-amd64.exe" \
            -DZDRIVE_EXE_NAME="zdrive-windows-amd64.exe" \
            installer/windows/zdrive-installer.nsi
          mv installer/windows/zdrive-windows-setup.exe dist/
          rm dist/winfsp.msi
      - uses: actions/upload-artifact@v4
        with: { name: zdrive-binaries, path: dist/ }

  # Separate, native runner (not cross-compiled from Linux) - a future tray
  # icon (M4) and the macOS .pkg installer (pkgbuild) both need real macOS
  # tooling/cgo, which ubuntu-latest can't provide. arm64 is this runner's
  # native arch; amd64 cross-compiles via Xcode's own clang (unlike a
  # cross-OS target, Apple's toolchain already supports both arches without
  # a separate cross C compiler).
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      # Same beta-channel version override as the build job above - see
      # its comment. Duplicated rather than shared across jobs (a job
      # output would need its own small job just to host this) since
      # it's a few lines and these two jobs are otherwise independent.
      - name: Compute version (beta channel support)
        run: |
          BASE_VERSION=$(sed -n 's/.*ClientVersion = "\(.*\)"/\1/p' backend/zdrive/zdrive.go | head -1)
          VERSION="$BASE_VERSION"
          if [ -n "${{ github.event.inputs.beta_suffix }}" ]; then
            VERSION="${BASE_VERSION}-beta.${{ github.event.inputs.beta_suffix }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LDFLAGS=-X github.com/vivekjaiswar/zdrive-desktop/backend/zdrive.ClientVersion=$VERSION" >> "$GITHUB_ENV"
      - run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -ldflags "$LDFLAGS" -o dist/zdrive-macos-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -ldflags "$LDFLAGS" -o dist/zdrive-macos-amd64 .
      # One-file .pkg per arch (no universal binary/lipo - matches the raw
      # binaries above, already shipped as separate arch-specific files).
      # No bundled driver needed here, unlike Windows/WinFsp - this project
      # mounts on macOS via the OS's own built-in NFS client.
      #
      # Ships a real ZDrive.app bundle (not a bare binary at
      # /usr/local/bin) - confirmed 2026-10-21 via research into what a
      # legitimate macOS app needs: the pin daemon (backend/zdrive/pin.go)
      # opens files directly under the NFS mountpoint from this very
      # process, which only gets a non-blank "ZDrive would like to access
      # files on a network volume" prompt (NSNetworkVolumesUsageDescription)
      # if the running executable actually lives inside a bundle with an
      # Info.plist - a bare binary has nowhere for that string to live, and
      # TCC has no stable bundle identity to attach the grant to either.
      # The postinstall script (installer/macos/scripts/postinstall)
      # symlinks /usr/local/bin/zdrive to the bundled binary so the
      # existing documented CLI invocation keeps working unchanged.
      - name: Build macOS .pkg installers
        run: |
          # $VERSION already computed above (includes the beta suffix,
          # if any) - reused here so the .pkg's own version metadata
          # matches what's actually baked into the binary inside it.
          for ARCH in arm64 amd64; do
            rm -rf pkgroot
            mkdir -p pkgroot/ZDrive.app/Contents/MacOS pkgroot/ZDrive.app/Contents/Resources
            cp "dist/zdrive-macos-$ARCH" pkgroot/ZDrive.app/Contents/MacOS/zdrive
            chmod +x pkgroot/ZDrive.app/Contents/MacOS/zdrive
            cp installer/macos/Info.plist pkgroot/ZDrive.app/Contents/Info.plist
            cp cmd/autostart/icon.icns pkgroot/ZDrive.app/Contents/Resources/icon.icns
            pkgbuild \
              --root pkgroot \
              --identifier com.zennialhub.zdrive \
              --version "$VERSION" \
              --install-location /Applications \
              --scripts installer/macos/scripts \
              "dist/zdrive-macos-$ARCH.pkg"
          done
          rm -rf pkgroot
      - uses: actions/upload-artifact@v4
        with: { name: zdrive-macos-binaries, path: dist/ }

  # Staging: every push to main (i.e. every merged PR) auto-publishes a
  # moving "staging" pre-release pointing at the latest main commit - the
  # desktop-client equivalent of the web app's auto-deployed sandbox, so
  # there's always a fresh, durable link to download and test the latest
  # merged code without waiting for a version bump + tag. Marked
  # --prerelease so GitHub's own "latest release" view skips it; the Go
  # client's own auto-update check is entirely backend-driven
  # (LatestKnownVersion via the X-ZDrive-Latest-Version header, not a
  # GitHub API scan) and never references this tag, so staging can never
  # reach real users by itself. Cutting an actual stable release for
  # everyone is still the separate, deliberate "push a v* tag" step below.
  release-staging:
    runs-on: ubuntu-latest
    needs: [build, build-macos]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: zdrive-binaries, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: zdrive-macos-binaries, path: dist }
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: Publish staging pre-release (moving tag, always overwritten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete staging --yes --cleanup-tag || true
          gh release create staging dist/* \
            --title "staging (latest main: ${GITHUB_SHA::7})" \
            --notes "Auto-built from $(git log -1 --format='%H %s')" \
            --prerelease \
            --target main

  # Tag-triggered only (push a "v*" tag to cut a release) - CI's own
  # upload-artifact downloads are time-limited, not a durable versioned
  # URL a field client could fetch from months later. A GitHub Release is
  # free, durable hosting this repo already gets for being public, and is
  # what the Go client's auto-update check (M4) downloads from.
  release:
    runs-on: ubuntu-latest
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # gh release create infers the target repo from the local git
      # remote - without a checkout, there's no .git directory at all and
      # it fails with "not a git repository" (confirmed by hitting this
      # for real on the v0.3.0 tag push). --generate-notes also needs the
      # actual commit history to build release notes from.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: zdrive-binaries, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: zdrive-macos-binaries, path: dist }
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
